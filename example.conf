[Interface]
# Clé privée du client WireGuard (en Base64)
PrivateKey = YAnF...votre_cle_privee_base64...=

# Adresse IP attribuée au client dans le tunnel VPN
Address = 10.0.0.2/32, fd80:5678::2/128

# (Optionnel) Serveurs DNS à utiliser lors de la connexion
DNS = 1.1.1.1, 8.8.8.8

[Peer]
# Clé publique du serveur VPN WireGuard (en Base64)
PublicKey = 8b9X...cle_publique_du_serveur_base64...=

# Adresse IP et port public du serveur VPN
Endpoint = vpn.exemple.com:51820

# Subnets IP qui doivent passer par le tunnel VPN (0.0.0.0/0 = tout le trafic)
AllowedIPs = 0.0.0.0/0, ::/0

# (Optionnel) Envoi de pings réguliers pour maintenir le tunnel ouvert
PersistentKeepalive = 25
